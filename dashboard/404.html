<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <!-- Всегда использовать последнюю версию IE или запрашивать Chrome Frame -->
        <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Использовать title, если он есть в YAML-разметке страницы -->
        <title>404 Страница не найдена</title>

        <link href="/dashboard/stylesheets/404-page.css" rel="stylesheet" type="text/css" />
        <link href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/3.1.0/css/font-awesome.min.css" rel="stylesheet" type="text/css" />

        <script src="/dashboard/javascripts/modernizr.js" type="text/javascript"></script>

        <link href="/dashboard/images/favicon.png" rel="icon" type="image/png" />
    </head>

<body>
    <div class="error-wrapper">
        <div class="error-container">
            <div class="error-code">404</div>
            <h1 class="error-title">Страница не найдена</h1>
            <p class="error-message">
                К сожалению, уже продана или адрес введён с ошибкой.
            </p>
            <div class="buttons-group">
                <a href="/" class="btn-primary" id="homeBtn">🏠 На главную</a>
                <a href="#" class="btn-secondary" id="requestBtn">📞 Оставить заявку</a>
            </div>

            <!-- Быстрые ссылки на другие разделы -->
            <div class="search-suggestions">
                <div class="suggestions-title">Другие районы</div>
                <div class="suggestions-links" id="districtLinks">
                    <a data-district="Центр">Центр</a>
                    <a data-district="Север">Север</a>
                    <a data-district="Юг">Юг</a>
                    <a data-district="Запад">Запад</a>
                    <a data-district="Восток">Восток</a>
                    <a data-district="Пригород">Пригород</a>
                </div>
            </div>
        </div>
    </div>

    <div id="toastMsg" class="toast-msg">✨ Сообщение</div>

    <script>
        // Частицы для атмосферы
        function createParticles() {
            const particlesContainer = document.createElement('div');
            particlesContainer.className = 'particles';
            document.body.appendChild(particlesContainer);
            
            for (let i = 0; i < 35; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 6 + 4 + 's';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        // Toast уведомления
        const toast = document.getElementById('toastMsg');
        function showMessage(text) {
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2800);
        }

        // Кнопка "На главную"
        const homeBtn = document.getElementById('homeBtn');
        if (homeBtn) {
            homeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                showMessage('🏠 Перенаправляем на главную страницу...');
                setTimeout(() => {
                    window.location.href = '/';
                }, 800);
            });
        }

        // Кнопка "Оставить заявку"
        const requestBtn = document.getElementById('requestBtn');
        if (requestBtn) {
            requestBtn.addEventListener('click', (e) => {
                e.preventDefault();
                showMessage('📝 Заявка будет доступна на главной странице. Перенаправляем...');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            });
        }

        // Ссылки на районы
        const districtLinks = document.querySelectorAll('#districtLinks a');
        districtLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const district = link.getAttribute('data-district') || link.innerText;
                showMessage(`🏙️ Район «${district}» — перейдите на главную страницу для просмотра новостроек`);
                setTimeout(() => {
                    window.location.href = '/';
                }, 1200);
            });
        });

        // Интерактивная иконка дома
        const houseIcon = document.getElementById('houseIcon');
        if (houseIcon) {
            const icons = ['🏗️🏠', '🔍❓', '🏢🔧', '📍🗺️', '🏠✨', '🔑🏘️'];
            let iconIndex = 0;
            houseIcon.addEventListener('click', () => {
                iconIndex = (iconIndex + 1) % icons.length;
                houseIcon.textContent = icons[iconIndex];
                showMessage('🔍 Попробуйте поискать на главной странице');
            });
        }

        // Анимация для 404 при наведении
        const errorCodeDiv = document.querySelector('.error-code');
        if (errorCodeDiv) {
            errorCodeDiv.addEventListener('mouseenter', () => {
                errorCodeDiv.style.transform = 'scale(1.05)';
                errorCodeDiv.style.transition = '0.2s';
            });
            errorCodeDiv.addEventListener('mouseleave', () => {
                errorCodeDiv.style.transform = 'scale(1)';
            });
        }

        // Консольное приветствие (пасхалка)
        console.log('%c🏠 404 страница | Новостройки', 'color: #FFD966; font-size: 16px; font-weight: bold;');
        console.log('%cВернитесь на главную, чтобы подобрать квартиру мечты!', 'color: #FFB347; font-size: 12px;');
    </script>
</body>
</html>
