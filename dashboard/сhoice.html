<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Кировский район - Просмотр квартир (без ограничений)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            padding: 32px 24px;
            color: #1e2a3e;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
            overflow: visible; /* изменено с hidden на visible, чтобы контент не обрезался */
            padding: 28px 32px 48px;
        }

        /* ШАПКА РАЙОНА */
        .district-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 18px;
            margin-bottom: 32px;
        }
        .district-title {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1f4f3c, #2c7a5e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .home-button {
            background: #f1f5f9;
            border: none;
            padding: 10px 22px;
            border-radius: 60px;
            font-weight: 600;
            color: #1e4620;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .home-button:hover {
            background: #e2e8f0;
            transform: translateY(-1px);
        }

        /* Строка счётчиков */
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 36px;
        }
        .section-headline {
            font-size: 1.7rem;
            font-weight: 650;
            color: #0f2c23;
            border-left: 5px solid #2b8c5e;
            padding-left: 16px;
        }
        .counters {
            display: flex;
            gap: 24px;
            background: #f9fafc;
            padding: 8px 20px;
            border-radius: 80px;
        }
        .counter-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-weight: 500;
        }
        .green-count, .red-count {
            color: white;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 1.2rem;
            min-width: 55px;
            text-align: center;
        }
        .green-count { background: #2c8c5a; }
        .red-count { background: #c73f1e; }

        /* Карточка ЖК */
        .complex-card {
            background: #ffffff;
            border-radius: 28px;
            margin-bottom: 40px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #eef2f6;
        }
        .complex-header {
            display: flex;
            gap: 28px;
            padding: 24px 28px 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .complex-image {
            flex: 0 0 140px;
            background: linear-gradient(145deg, #dbebdf, #cbdcd0);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
        }
        .img-placeholder {
            text-align: center;
            font-size: 3rem;
            color: #487a60;
        }
        .img-placeholder span {
            display: block;
            font-size: 0.7rem;
            margin-top: 8px;
        }
        .complex-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .info-row-1 {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
        }
        .complex-name {
            font-size: 1.9rem;
            font-weight: 700;
        }
        .price-deadline {
            display: flex;
            gap: 18px;
            background: #f2f5f9;
            padding: 6px 16px;
            border-radius: 60px;
        }
        .info-row-2 {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 16px;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #cbdbe0;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background: #1f6e4a;
            border: none;
            padding: 8px 32px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }

        /* Блок квартир */
        .apartments-wrapper {
            margin: 0 28px 24px;
            border-top: 1px solid #eef2f8;
            padding-top: 20px;
        }
        .apartments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .apartments-title {
            display: flex;
            align-items: center;
            gap: 18px;
            font-weight: 700;
            font-size: 1.25rem;
        }
        .apartment-badge {
            background: #eef2f6;
            padding: 4px 12px;
            border-radius: 32px;
        }
        .apartments-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .apartments-list.open {
            max-height: 2000px; /* достаточно большое значение, но не бесконечное. Чтобы гарантированно не обрезать, убираем ограничение по высоте в открытом состоянии */
        }
        /* Убираем ограничение высоты для внутренней сетки, чтобы карточки всегда были видны */
        .apartments-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px 8px 12px;
        }

        /* Базовая карточка квартиры */
        .apartment-card {
            background: #f9fafd;
            border-radius: 24px;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border: 1px solid #eef2f6;
            transition: all 0.2s;
        }
        /* Особое предложение — яркая карточка */
        .apartment-card.special-offer {
            background: linear-gradient(115deg, #fff5eb, #ffe8d9);
            border-left: 8px solid #e65c2e;
            box-shadow: 0 6px 14px -6px rgba(230, 92, 46, 0.2);
        }
        .apartment-card.special-offer .apt-price {
            color: #e65c2e;
            font-size: 1.2rem;
        }
        .apartment-card.special-offer .apt-price::before {
            content: "🔥 ";
        }

        .apartment-details {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            align-items: baseline;
        }
        .apt-type {
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 130px;
        }
        .apt-area, .apt-floor {
            background: #eef3ef;
            padding: 4px 14px;
            border-radius: 32px;
            font-size: 0.85rem;
        }
        .apt-price {
            font-weight: 800;
            color: #2c6e47;
            font-size: 1.1rem;
        }
        .apt-actions {
            display: flex;
            gap: 12px;
        }
        .btn-sm {
            background: white;
            border: 1px solid #cddfd4;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-sm-primary {
            background: #1f6e4a;
            border: none;
            color: white;
        }

        /* ===== РАСШИРЕННЫЙ РЕЖИМ (ПО КНОПКЕ "СМОТРЕТЬ ▼") ===== */
        .apartment-card.expanded {
            flex-direction: column;
            align-items: stretch;
            background: #ffffff;
            border: 2px solid #2b8c5e;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.15);
            cursor: default;
            padding: 20px;
        }
        .apartment-card.special-offer.expanded {
            background: linear-gradient(115deg, #fffaf5, #fff2e6);
            border-left: 8px solid #e65c2e;
        }
        /* Верхняя строка: заголовок (apt-type) + кнопка "Оставить заявку" */
        .expanded-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
            width: 100%;
        }
        .expanded-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #1e3a2f;
        }
        .expanded-actions {
            display: flex;
            gap: 12px;
        }
        /* Основная область: изображение слева, список деталей справа */
        .expanded-content {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            align-items: flex-start;
        }
        .expanded-image {
            flex: 0 0 180px;
            background: #eef2f0;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 12px;
            min-height: 160px;
        }
        .expanded-image .img-placeholder-lg {
            text-align: center;
            font-size: 4rem;
        }
        .expanded-image .img-placeholder-lg span {
            display: block;
            font-size: 0.75rem;
            color: #5f7c6b;
            margin-top: 8px;
        }
        .expanded-details-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .detail-row {
            display: flex;
            align-items: baseline;
            gap: 24px;
            flex-wrap: wrap;
            border-bottom: 1px dashed #e2e8e4;
            padding-bottom: 8px;
        }
        .detail-label {
            font-weight: 600;
            color: #2c5a44;
            min-width: 100px;
        }
        .detail-value {
            color: #1f2f3c;
            font-weight: 500;
        }
        .close-expand-btn {
            background: transparent;
            border: 1px solid #cbd5e1;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 16px;
            align-self: flex-start;
        }
        .close-expand-btn:hover {
            background: #eef2f6;
        }

        /* Баннер и футер */
        .limited-banner {
            margin: 16px 28px 28px;
            background: #fff6e8;
            border-left: 6px solid #e67e22;
            border-radius: 20px;
            padding: 12px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-pick {
            background: #e67e22;
            border: none;
            padding: 8px 26px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .leave-request-footer {
            margin-top: 48px;
            background: #eef4ec;
            border-radius: 36px;
            padding: 28px 32px;
            text-align: center;
        }
        .mock-form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 12px;
        }
        .mock-input {
            padding: 12px 20px;
            border-radius: 60px;
            border: none;
            width: 260px;
            background: white;
        }
        .btn-submit {
            background: #1f6e4a;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
        }
        @media (max-width: 760px) {
            .container { padding: 20px; }
            .expanded-content { flex-direction: column; }
            .expanded-image { flex-basis: auto; width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="district-header">
        <h1 class="district-title">🏘️ Кировский район</h1>
        <button class="home-button" id="homeBtn"><span>🏠</span> На главный экран</button>
    </div>

    <div class="stats-row">
        <div class="section-headline">Новостройки в районе</div>
        <div class="counters">
            <div class="counter-item"><span>Всего квартир:</span><span class="green-count" id="totalApartmentsCount">0</span></div>
            <div class="counter-item"><span>Особая цена 🔥:</span><span class="red-count" id="specialPriceCount">0</span></div>
        </div>
    </div>

    <!-- ЖК Солнечный -->
    <div class="complex-card">
        <div class="complex-header">
            <div class="complex-image"><div class="img-placeholder">🏞️<span>ЖК Солнечный</span></div></div>
            <div class="complex-info">
                <div class="info-row-1"><span class="complex-name">ЖК Солнечный</span><div class="price-deadline"><span>от 5.2 млн ₽</span><span>сдача 2025</span></div></div>
                <div class="info-row-2"><button class="btn-primary request-complex" data-complex="Солнечный">Оставить заявку</button></div>
            </div>
        </div>
        <div class="apartments-wrapper">
            <div class="apartments-header"><div class="apartments-title"><span>🏢 Квартиры в ЖК</span><span class="apartment-badge" id="solarCountBadge">0</span></div></div>
            <div class="apartments-list" id="solarApartmentsList"><div class="apartments-grid" id="solarApartmentsGrid"></div></div>
        </div>
    </div>

    <div class="limited-banner"><div class="limited-text">🔥 ОСТАЛОСЬ ВСЕГО 2 ОБЪЕКТА</div><button class="btn-pick" id="pickApartBtn">ПОДОБРАТЬ КВАРТИРУ ➤</button></div>

    <!-- ЖК Парк -->
    <div class="complex-card">
        <div class="complex-header">
            <div class="complex-image"><div class="img-placeholder">🌳<span>ЖК Парк</span></div></div>
            <div class="complex-info">
                <div class="info-row-1"><span class="complex-name">ЖК Парк</span><div class="price-deadline"><span>от 6.8 млн ₽</span><span>сдача 2024</span></div></div>
                <div class="info-row-2"><button class="btn-outline toggle-details-btn" data-target="park">Подробнее ▼</button><button class="btn-primary request-complex" data-complex="Парк">Оставить заявку</button></div>
            </div>
        </div>
        <div class="apartments-wrapper">
            <div class="apartments-header"><div class="apartments-title"><span>🏢 Квартиры в ЖК</span><span class="apartment-badge" id="parkCountBadge">0</span></div></div>
            <div class="apartments-list" id="parkApartmentsList"><div class="apartments-grid" id="parkApartmentsGrid"></div></div>
        </div>
    </div>

    <div class="leave-request-footer"><h3>📋 ОСТАВИТЬ ЗАЯВКУ</h3><div class="mock-form"><input type="text" placeholder="Ваше имя" class="mock-input"><input type="tel" placeholder="Телефон" class="mock-input"><button class="btn-submit" id="globalRequestBtn">Отправить заявку</button></div><p style="font-size: 12px; margin-top: 12px;">Наш менеджер свяжется с вами</p></div>
</div>

<script>
    // Данные квартир
    const apartmentsData = {
        solar: [
            { rooms: "1-комнатная", area: "40м²", price: "4 850 000 ₽", floor: 3, special: false, desc: "Светлая кухня-гостиная, остекленный балкон, вид во двор." },
            { rooms: "2-комнатная", area: "60м²", price: "6 290 000 ₽", floor: 5, special: false, desc: "Раздельные комнаты, кладовая, высокие потолки." },
            { rooms: "2-комнатная", area: "60м²", price: "5 990 000 ₽", floor: 5, special: true, desc: "🔥 ОГРОМНАЯ СКИДКА! Полная отделка, техника в подарок." },
            { rooms: "3-комнатная", area: "80м²", price: "8 750 000 ₽", floor: 7, special: false, desc: "Просторная квартира с тремя изолированными комнатами." }
        ],
        park: [
            { rooms: "1-комнатная", area: "38м²", price: "5 100 000 ₽", floor: 4, special: false, desc: "Уютная студия, современная планировка." },
            { rooms: "2-комнатная", area: "58м²", price: "6 950 000 ₽", floor: 6, special: false, desc: "Две спальни, просторная прихожая." },
            { rooms: "3-комнатная", area: "85м²", price: "9 200 000 ₽", floor: 2, special: true, desc: "🔥 МЕГА-ЦЕНА! Квартира с террасой и панорамным видом на парк." }
        ]
    };

    // Глобальные счётчики
    function updateGlobalCounters() {
        let total = 0, special = 0;
        for (let key in apartmentsData) {
            total += apartmentsData[key].length;
            special += apartmentsData[key].filter(a => a.special).length;
        }
        document.getElementById('totalApartmentsCount').innerText = total;
        document.getElementById('specialPriceCount').innerText = special;
    }

    // Рендер списка квартир
    function renderApartments(complexKey, containerId, badgeId) {
        const apartments = apartmentsData[complexKey];
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        apartments.forEach((apt, idx) => {
            const card = document.createElement('div');
            card.className = 'apartment-card';
            if (apt.special) card.classList.add('special-offer');
            card.setAttribute('data-apt-idx', idx);
            card.setAttribute('data-complex', complexKey);
            // Свёрнутое содержимое
            card.innerHTML = `
                <div class="apartment-details">
                    <div class="apt-type">${apt.rooms}</div>
                    <div class="apt-area">${apt.area}</div>
                    <div class="apt-price">${apt.price}</div>
                    <div class="apt-floor">Этаж: ${apt.floor}</div>
                </div>
                <div class="apt-actions">
                    <button class="btn-sm view-detail-btn">Смотреть ▼</button>
                    <button class="btn-sm btn-sm-primary request-apartment-btn">Оставить заявку</button>
                </div>
            `;
            // Обработчик для кнопки "Смотреть ▼" — именно она раскрывает карточку
            const viewBtn = card.querySelector('.view-detail-btn');
            const requestBtn = card.querySelector('.request-apartment-btn');
            
            viewBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                expandCardByView(card, apt, complexKey);
            });
            requestBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                alert(`Заявка на ${apt.rooms} в ЖК ${complexKey === 'solar' ? 'Солнечный' : 'Парк'}`);
            });
            container.appendChild(card);
        });
        document.getElementById(badgeId).innerText = apartments.length;
    }

    // Функция раскрытия карточки по кнопке "Смотреть"
    function expandCardByView(card, aptData, complexKey) {
        // Если уже раскрыта — ничего не делаем
        if (card.classList.contains('expanded')) return;
        
        // Сохраняем оригинальный HTML для сворачивания
        const originalHtml = card.innerHTML;
        card.setAttribute('data-original-html', originalHtml);
        card.classList.add('expanded');
        card.innerHTML = '';
        
        const complexName = complexKey === 'solar' ? 'ЖК Солнечный' : 'ЖК Парк';
        
        // Верхняя строка: заголовок (apt-type) и кнопка "Оставить заявку" (кнопка "Смотреть" отсутствует)
        const headerDiv = document.createElement('div');
        headerDiv.className = 'expanded-header';
        headerDiv.innerHTML = `
            <div class="expanded-title">${aptData.rooms}</div>
            <div class="expanded-actions">
                <button class="btn-sm btn-sm-primary expanded-request-btn">Оставить заявку</button>
            </div>
        `;
        
        // Основная область: изображение (заглушка) слева, справа — детали (площадь, цена, этаж, описание)
        const contentDiv = document.createElement('div');
        contentDiv.className = 'expanded-content';
        contentDiv.innerHTML = `
            <div class="expanded-image">
                <div class="img-placeholder-lg">
                    🏙️
                    <span>Изображение ЖК</span>
                </div>
            </div>
            <div class="expanded-details-list">
                <div class="detail-row"><div class="detail-label">📐 Площадь:</div><div class="detail-value">${aptData.area}</div></div>
                <div class="detail-row"><div class="detail-label">💰 Цена:</div><div class="detail-value">${aptData.price}</div></div>
                <div class="detail-row"><div class="detail-label">🏢 Этаж:</div><div class="detail-value">${aptData.floor}</div></div>
                <div class="detail-row"><div class="detail-label">🏗️ Жилой комплекс:</div><div class="detail-value">${complexName}</div></div>
                <div class="detail-row"><div class="detail-label">📝 Описание:</div><div class="detail-value">${aptData.desc || 'Отличная планировка, развитая инфраструктура.'}</div></div>
            </div>
        `;
        
        // Кнопка "Свернуть" для закрытия расширенного вида
        const closeBtn = document.createElement('button');
        closeBtn.className = 'close-expand-btn';
        closeBtn.textContent = 'Свернуть ▲';
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            collapseCard(card, aptData, complexKey);
        });
        
        card.appendChild(headerDiv);
        card.appendChild(contentDiv);
        card.appendChild(closeBtn);
        
        // Обработчик для кнопки "Оставить заявку" внутри expanded
        const expandedRequest = card.querySelector('.expanded-request-btn');
        if (expandedRequest) {
            expandedRequest.addEventListener('click', (e) => {
                e.stopPropagation();
                alert(`Заявка на ${aptData.rooms} в ${complexName}`);
            });
        }
    }
    
    // Функция сворачивания карточки обратно в исходное состояние
    function collapseCard(card, aptData, complexKey) {
        if (!card.classList.contains('expanded')) return;
        const original = card.getAttribute('data-original-html');
        if (original) {
            card.innerHTML = original;
            card.classList.remove('expanded');
            // Перепривязываем обработчики к кнопкам после восстановления HTML
            const newViewBtn = card.querySelector('.view-detail-btn');
            const newRequestBtn = card.querySelector('.request-apartment-btn');
            if (newViewBtn) {
                newViewBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    expandCardByView(card, aptData, complexKey);
                });
            }
            if (newRequestBtn) {
                newRequestBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    alert(`Заявка на ${aptData.rooms} в ЖК ${complexKey === 'solar' ? 'Солнечный' : 'Парк'}`);
                });
            }
        }
    }

    // Управление раскрытием списка квартир (кнопка "Подробнее ▼" в шапке ЖК)
    function initDropdowns() {
        const toggles = document.querySelectorAll('.toggle-details-btn');
        toggles.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const target = btn.getAttribute('data-target');
                const list = document.getElementById(`${target}ApartmentsList`);
                if (list) {
                    list.classList.toggle('open');
                    btn.innerHTML = list.classList.contains('open') ? 'Подробнее ▲' : 'Подробнее ▼';
                }
            });
        });
        // По умолчанию открываем список Солнечного
        const solarList = document.getElementById('solarApartmentsList');
        const solarBtn = document.querySelector('.toggle-details-btn[data-target="solar"]');
        if (solarList && !solarList.classList.contains('open')) {
            solarList.classList.add('open');
            if (solarBtn) solarBtn.innerHTML = 'Подробнее ▲';
        }
    }

    // Общие обработчики
    function bindCommon() {
        document.querySelectorAll('.request-complex').forEach(btn => {
            btn.addEventListener('click', () => alert(`Заявка на ЖК "${btn.getAttribute('data-complex')}" принята!`));
        });
        document.getElementById('homeBtn')?.addEventListener('click', () => alert('Возврат на главный экран (демо)'));
        document.getElementById('pickApartBtn')?.addEventListener('click', () => alert('Подбор квартиры: укажите параметры в заявке'));
        document.getElementById('globalRequestBtn')?.addEventListener('click', () => alert('Спасибо! Заявка отправлена.'));
    }

    // Инициализация
    renderApartments('solar', 'solarApartmentsGrid', 'solarCountBadge');
    renderApartments('park', 'parkApartmentsGrid', 'parkCountBadge');
    updateGlobalCounters();
    initDropdowns();
    bindCommon();
</script>
</body>
</html>
