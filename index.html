<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <!-- Всегда использовать последнюю версию IE или запрашивать Chrome Frame -->
        <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Использовать title, если он есть в YAML-разметке страницы -->
        <title>Новостройки в Ярославле </title>

        <meta name="description" content="Новостройки в Ярославле — поиск и покупка квартир" />
        <meta name="keywords" content="застройщик, ипотека, скидки" />

        <link href="/dashboard/stylesheets/top-bar.css" rel="stylesheet" type="text/css" />
        <link href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/3.1.0/css/font-awesome.min.css" rel="stylesheet" type="text/css" />

        <script src="/javascripts/top-bar.js" type="text/javascript"></script>

        <link href="/dashboard/images/favicon.png" rel="icon" type="image/png" />
    </head>

<body>
    <div class="top-bar">
        <div class="container">
            <!-- Логотип слева (SVG + текст) -->
            <div class="logo-area">
                <div class="logo-icon">
                    <!-- красивый абстрактный логотип (компас/звезда) -->
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L15 8.5L22 9.5L17 14L18.5 21L12 17.5L5.5 21L7 14L2 9.5L9 8.5L12 2Z" fill="white" stroke="#2c7da0" stroke-width="1.2" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="2.5" fill="#FFD966" stroke="#b97f10" stroke-width="0.8"/>
                    </svg>
                </div>
                <span class="logo-text">NORTHWIND</span>
            </div>

            <!-- Бургер кнопка (внутри top-bar, справа) -->
            <div class="burger-btn" id="burgerBtn">
                <div class="burger-line"></div>
                <div class="burger-line"></div>
                <div class="burger-line"></div>
            </div>
        </div>
    </div>

    <script>
        // JavaScript для бургер-меню
        const burgerBtn = document.getElementById('burgerBtn');
        
        burgerBtn.addEventListener('click', function() {
            this.classList.toggle('active');
        });
    </script>
</body>
</html>
