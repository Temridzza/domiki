<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Страница не найдена | Новостройки в Ярославле</title>
    <meta name="description" content="Страница не найдена - вернитесь на главную." />

    <!-- Styles -->
    <link href="./stylesheets/page/mistake.css" rel="stylesheet" type="text/css" />
    
    <!-- Для иконок -->
    <link href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
    <link href="./images/favicon.png" rel="icon" type="image/png" />
</head>
<body>
<div class="error-wrapper">
    <div class="error-container">
        <!-- Домашняя иконка с анимацией -->
        <div class="house-icon" id="houseIcon">
            🏠
        </div>

        <!-- 404 анимация -->
        <div class="error-code" id="errorCode">
            404
        </div>
        
        <h1 class="error-title">Страница не найдена</h1>
        <p class="error-message">
            К сожалению, запрашиваемая страница не существует или была перемещена.
        </p>
        
        <!-- Кнопки с иконками -->
        <div class="buttons-group">
            <a href="/" class="btn-primary" id="homeBtn">
                <i class="fas fa-home"></i> На главную
            </a>
            <a href="#" class="btn-secondary" id="showFormBtn">
                <i class="fas fa-pen-alt"></i> Оставить заявку
            </a>
        </div>

        <!-- ФОРМА ЗАЯВКИ (скрыта до клика на кнопку) -->
        <div class="form-section" id="applicationForm">
            <div class="form-wrapper">
                <h3>📋 Оставьте заявку</h3>
                <div class="form-desc">Подберем идеальный вариант и ответим на все вопросы</div>
                <form id="leadForm">
                    <div class="form-group-vertical">
                        <input type="text" class="input-field" placeholder="Ваше имя" id="userName">
                        <input type="tel" class="input-field" placeholder="Номер телефона" id="userPhone">
                        <textarea class="input-field" placeholder="Ваши пожелания (количество комнат, бюджет, этаж, срок покупки...)" id="userWishes"></textarea>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-paper-plane"></i> ОТПРАВИТЬ ЗАЯВКУ
                    </button>
                    <p class="form-agreement">Нажимая на кнопку, вы соглашаетесь с обработкой персональных данных</p>
                </form>
            </div>
        </div>

        <!-- Быстрые ссылки на районы (генерируются из JS) -->
        <div class="search-suggestions">
            <div class="suggestions-title">
                <i class="fas fa-map-marker-alt"></i> Популярные районы
            </div>
            <div class="suggestions-links" id="districtLinks"></div>
        </div>
    </div>

    <!-- Toast уведомление -->
    <div id="toastMsg" class="toast-msg">
        <i class="fas fa-info-circle"></i> <span id="toastText">Сообщение</span>
    </div>
</div>

<!-- Частицы -->
<div class="particles" id="particlesContainer"></div>

<!-- JavaScript -->
<script src="./javascripts/404.js"></script>
</body>
</html>
